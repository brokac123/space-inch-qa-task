name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run API test suite
    runs-on: ubuntu-latest

    # Non-secret configuration. Real credentials would come from repository secrets instead.
    env:
      BASE_URL: https://jsonplaceholder.typicode.com
      FIRST_NAME_LETTER: L

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Publish test summary
        if: always()
        run: node scripts/ciSummary.js

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: cypress/reports/
          retention-days: 30

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    # Runs even when tests fail - a failing report is the one worth reading.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download report from the test job
        uses: actions/download-artifact@v8
        with:
          name: test-report
          path: report

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
